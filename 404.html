<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Page Not Found | Slate Core</title>
<link rel="icon" type="image/png" href="/masterai-tech/assets/sltc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0eb;
    --text-primary: #1a1715;
    --text-secondary: #5c554c;
    --text-muted: #9a9189;
    --red: #dc2626;
    --border: #e0d9d0;
    --ease: cubic-bezier(0.16,1,0.3,1);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    font-family: 'Poppins', sans-serif;
    color: var(--text-primary);
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--text-primary);
    margin-bottom: 56px;
  }
  .brand img { height: 34px; object-fit: contain; }
  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.5px; }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(72px, 18vw, 160px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -6px;
    color: var(--red);
    margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 14px;
  }
  p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-secondary);
    max-width: 460px;
    margin-bottom: 36px;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px; font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 100px;
    transition: all .3s var(--ease);
  }
  .btn-solid { background: var(--text-primary); color: var(--bg); }
  .btn-solid:hover { background: var(--red); color: #fff; transform: translateY(-2px); }
  .btn-outline { border: 1.5px solid var(--border); color: var(--text-secondary); }
  .btn-outline:hover { border-color: var(--text-primary); color: var(--text-primary); }
  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { color: var(--red); }
</style>
</head>
<body>

  <a href="/masterai-tech/" class="brand">
    <img src="/masterai-tech/assets/sltc-logo.png" alt="Slate Core">
    <span class="brand-name">Slate Core</span>
  </a>

  <div class="code">404</div>
  <h1>This page doesn't exist.</h1>
  <p>The breakdown you're looking for may have moved, or the URL has a typo. Every post lives in the feed — start there.</p>

  <div class="actions">
    <a href="/masterai-tech/#feed" class="btn btn-solid">Back to the feed &rarr;</a>
    <a href="https://www.instagram.com/slatecore/" target="_blank" rel="noopener" class="btn btn-outline">@slatecore on IG</a>
  </div>

  <footer>
    &copy; 2026 Slate Core &middot; <a href="/masterai-tech/">willtc190609-rgb.github.io/masterai-tech</a>
  </footer>

</body>
</html>
